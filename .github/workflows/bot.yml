name: Parser Bot
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: parser-bot
  cancel-in-progress: false

# Даем боту права на запись в репозиторий, чтобы он мог делать коммит
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PARSER_PAT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py
        
      # СОХРАНЯЕМ ФАЙЛ В РЕПОЗИТОРИЙ
      - name: Commit Cache and Dead Hashes
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          FILES=""
          [ -f dead_hashes.txt ] && FILES="$FILES dead_hashes.txt"
          [ -f github_seen_repos.txt ] && FILES="$FILES github_seen_repos.txt"
          [ -f github_pages.json ] && FILES="$FILES github_pages.json"

          if [ -n "$FILES" ]; then
            git add $FILES
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update caches [skip ci]" && git push)
          else
            echo "Нет файлов для коммита."
          fi
